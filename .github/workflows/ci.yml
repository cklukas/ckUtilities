name: CI
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
# Shared with release so their native builds stay serialized.
concurrency:
  group: ckutilities-native-serial
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/qualify.yml
    with:
      frontend_sha: ${{ github.sha }}
