name: CI
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
# Shared with release and Pages. Serialize runs, never cancel active builds.
concurrency:
  group: ckutilities-native-serial
  cancel-in-progress: false
  queue: max
jobs:
  qualify:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/qualify.yml
    with:
      frontend_sha: ${{ github.sha }}
