name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ckVision build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install --quiet ninja curl

      - name: Checkout pinned ckVision 0.1.3 source
        uses: actions/checkout@v4
        with:
          repository: cklukas/ckVision
          ref: 4f211569a95ddcd0875d6c5d9778d06d2bf74fec
          path: .deps/ckvision
          persist-credentials: false

      - name: Build pinned ckVision SDK
        id: ckvision
        shell: bash
        run: |
          scripts/build_ckvision_sdk.sh .deps/ckvision "$RUNNER_TEMP/ckvision-sdk" "$RUNNER_TEMP/ckvision-build"
          echo "prefix=$RUNNER_TEMP/ckvision-sdk" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: >
          cmake --preset dev
          -DCMAKE_PREFIX_PATH="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_CKVISION_PREFIX="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_VERIFY_CKVISION_PACKAGE=ON
          -DCKTOOLS_BUILD_DOCUMENTATION_CAPTURES=ON
          -DCKTOOLS_CKVISION_SOURCE_DIR="$GITHUB_WORKSPACE/.deps/ckvision"

      - name: Build native products and package consumer
        run: cmake --build build/dev --target verify_ckvision_package

      - name: Run tests
        run: ctest --test-dir build/dev --output-on-failure

      - name: Regenerate and verify README screenshots
        shell: bash
        run: |
          mkdir -p docs/generated/screenshots
          build/dev/tools/docgen/capture_ckutilities_screenshots docs/generated/screenshots
          git diff --exit-code -- docs/generated/screenshots
          test -z "$(git status --porcelain --untracked-files=all -- docs/generated/screenshots)"

  package-linux:
    name: ckVision Linux packages
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config libcurl4-openssl-dev rpm

      - name: Checkout pinned ckVision 0.1.3 source
        uses: actions/checkout@v4
        with:
          repository: cklukas/ckVision
          ref: 4f211569a95ddcd0875d6c5d9778d06d2bf74fec
          path: .deps/ckvision
          persist-credentials: false

      - name: Build pinned ckVision SDK
        id: ckvision
        shell: bash
        run: |
          scripts/build_ckvision_sdk.sh .deps/ckvision "$RUNNER_TEMP/ckvision-sdk" "$RUNNER_TEMP/ckvision-build"
          echo "prefix=$RUNNER_TEMP/ckvision-sdk" >> "$GITHUB_OUTPUT"

      - name: Configure release package
        run: >
          cmake --preset pkg
          -DCMAKE_PREFIX_PATH="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_CKVISION_PREFIX="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_VERIFY_CKVISION_PACKAGE=ON
          -DCKTOOLS_VERIFY_CKVISION_INSTALL=ON
          -DCKTOOLS_VERIFY_CKVISION_ARCHIVE=ON
          -DCKTOOLS_VERIFY_CKVISION_TERMINAL=ON

      - name: Verify and build packages
        run: |
          cmake --build build/pkg --target verify_ckvision_rehearsal
          cmake --build build/pkg --target verify_ckvision_terminal

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ck-utilities-linux-packages
          if-no-files-found: error
          path: |
            build/pkg/*.deb
            build/pkg/*.rpm
            build/pkg/*.tar.gz

  package-macos:
    name: ckVision macOS archive
    runs-on: macos-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install --quiet ninja curl

      - name: Checkout pinned ckVision 0.1.3 source
        uses: actions/checkout@v4
        with:
          repository: cklukas/ckVision
          ref: 4f211569a95ddcd0875d6c5d9778d06d2bf74fec
          path: .deps/ckvision
          persist-credentials: false

      - name: Build pinned ckVision SDK
        id: ckvision
        shell: bash
        run: |
          scripts/build_ckvision_sdk.sh .deps/ckvision "$RUNNER_TEMP/ckvision-sdk" "$RUNNER_TEMP/ckvision-build"
          echo "prefix=$RUNNER_TEMP/ckvision-sdk" >> "$GITHUB_OUTPUT"

      - name: Configure release archive
        run: >
          cmake --preset pkg -DCMAKE_INSTALL_PREFIX=.
          -DCMAKE_PREFIX_PATH="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_CKVISION_PREFIX="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_VERIFY_CKVISION_PACKAGE=ON
          -DCKTOOLS_VERIFY_CKVISION_INSTALL=ON
          -DCKTOOLS_VERIFY_CKVISION_ARCHIVE=ON
          -DCKTOOLS_VERIFY_CKVISION_TERMINAL=ON

      - name: Verify and build archive
        run: |
          cmake --build build/pkg --target verify_ckvision_rehearsal
          cmake --build build/pkg --target verify_ckvision_terminal

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ck-utilities-macos-archive
          if-no-files-found: error
          path: build/pkg/*.tar.gz
