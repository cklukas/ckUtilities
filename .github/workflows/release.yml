name: Release Packages
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ckutilities-native-serial
  cancel-in-progress: false
  queue: max
jobs:
  qualify:
    uses: ./.github/workflows/qualify.yml
    with:
      frontend_sha: ${{ github.sha }}
      release_tag: ${{ github.event.release.tag_name }}
  publish:
    # No assets/formula attached unless every full native platform gate passed.
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      CTEST_PARALLEL_LEVEL: '1'
      MAKEFLAGS: -j1
      ARCHIVE_BUILD_JOBS: '1'
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: ckutilities-*-packages
          path: ${{ runner.temp }}/ckutilities-qualified-release
          merge-multiple: false
      - name: Require every platform's already-qualified package
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ckutilities-qualified-release"
          test -n "$(find "$root/ckutilities-Linux-packages" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find "$root/ckutilities-Linux-packages" -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$(find "$root/ckutilities-Linux-packages" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -f "$root/ckutilities-Linux-packages/ck-utilities.rb"
          test -n "$(find "$root/ckutilities-macOS-packages" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$(find "$root/ckutilities-Windows-packages" -maxdepth 1 -name '*.zip' -print -quit)"
          cd "$root/ckutilities-Windows-packages"
          for checksum in *.zip.sha256; do sha256sum --check --strict "$checksum"; done
      - name: Attach to the existing release only (never create a release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          QUALIFIED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ckutilities-qualified-release"
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find "$root" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.rb' -o -name '*.zip' -o -name '*.zip.sha256' \) -print0)
          (( ${#files[@]} >= 8 ))
          [[ "$GITHUB_REPOSITORY" == 'cklukas/ckUtilities' ]]
          [[ "$QUALIFIED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/ckutilities-release-tag.XXXXXXXX")
          export TMPDIR="$work" TMP="$work" TEMP="$work"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --bare "$work/source.git"
          git -c core.hooksPath=/dev/null -c credential.helper= --git-dir="$work/source.git" fetch --no-tags \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "+refs/tags/$RELEASE_TAG:refs/tags/qualified"
          peeled=$(git --git-dir="$work/source.git" rev-parse --verify 'refs/tags/qualified^{commit}')
          test "$peeled" = "$QUALIFIED_SOURCE_SHA"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          test "$id" = "$RELEASE_ID"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}"
