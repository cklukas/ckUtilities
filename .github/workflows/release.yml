name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-tests:
    name: ckVision release tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install --quiet ninja curl

      - name: Install pinned ckVision SDK
        id: ckvision
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export CKVISION_SDK_URL='${{ vars.CKVISION_SDK_LINUX_URL }}'
            export CKVISION_SDK_SHA256='${{ vars.CKVISION_SDK_LINUX_SHA256 }}'
          else
            export CKVISION_SDK_URL='${{ vars.CKVISION_SDK_MACOS_URL }}'
            export CKVISION_SDK_SHA256='${{ vars.CKVISION_SDK_MACOS_SHA256 }}'
          fi
          prefix="$(scripts/install_ckvision_sdk.sh "$RUNNER_TEMP/ckvision-sdk")"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: >
          cmake --preset dev
          -DCMAKE_PREFIX_PATH="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_CKVISION_PREFIX="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_VERIFY_CKVISION_PACKAGE=ON

      - name: Build native products and package consumer
        run: cmake --build build/dev --target verify_ckvision_package

      - name: Run tests
        run: ctest --test-dir build/dev --output-on-failure

  release-linux:
    name: Publish ckVision Linux packages
    needs: release-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config libcurl4-openssl-dev rpm

      - name: Install pinned ckVision SDK
        id: ckvision
        shell: bash
        env:
          CKVISION_SDK_URL: ${{ vars.CKVISION_SDK_LINUX_URL }}
          CKVISION_SDK_SHA256: ${{ vars.CKVISION_SDK_LINUX_SHA256 }}
        run: |
          prefix="$(scripts/install_ckvision_sdk.sh "$RUNNER_TEMP/ckvision-sdk")"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Configure verified package
        run: >
          cmake --preset pkg
          -DCMAKE_PREFIX_PATH="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_CKVISION_PREFIX="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_VERIFY_CKVISION_PACKAGE=ON
          -DCKTOOLS_VERIFY_CKVISION_INSTALL=ON
          -DCKTOOLS_VERIFY_CKVISION_ARCHIVE=ON
          -DCKTOOLS_VERIFY_CKVISION_TERMINAL=ON

      - name: Verify and build packages
        run: |
          cmake --build build/pkg --target verify_ckvision_rehearsal
          cmake --build build/pkg --target verify_ckvision_terminal

      - name: Attach Linux packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/pkg/*.deb
            build/pkg/*.rpm
            build/pkg/*.tar.gz

  release-macos:
    name: Publish ckVision macOS archive
    needs: release-tests
    runs-on: macos-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install dependencies
        run: brew install --quiet ninja curl

      - name: Install pinned ckVision SDK
        id: ckvision
        shell: bash
        env:
          CKVISION_SDK_URL: ${{ vars.CKVISION_SDK_MACOS_URL }}
          CKVISION_SDK_SHA256: ${{ vars.CKVISION_SDK_MACOS_SHA256 }}
        run: |
          prefix="$(scripts/install_ckvision_sdk.sh "$RUNNER_TEMP/ckvision-sdk")"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Configure verified archive
        run: >
          cmake --preset pkg -DCMAKE_INSTALL_PREFIX=.
          -DCMAKE_PREFIX_PATH="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_CKVISION_PREFIX="${{ steps.ckvision.outputs.prefix }}"
          -DCKTOOLS_VERIFY_CKVISION_PACKAGE=ON
          -DCKTOOLS_VERIFY_CKVISION_INSTALL=ON
          -DCKTOOLS_VERIFY_CKVISION_ARCHIVE=ON
          -DCKTOOLS_VERIFY_CKVISION_TERMINAL=ON

      - name: Verify and build archive
        run: |
          cmake --build build/pkg --target verify_ckvision_rehearsal
          cmake --build build/pkg --target verify_ckvision_terminal

      - name: Attach macOS archive
        uses: softprops/action-gh-release@v2
        with:
          files: build/pkg/*.tar.gz

  release-homebrew-formula:
    name: Attach Homebrew formula
    needs: release-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Generate formula from immutable release source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          version="${RELEASE_TAG#v}"
          source_url="$SERVER_URL/$REPOSITORY/archive/refs/tags/$RELEASE_TAG.tar.gz"
          curl --fail --location --silent --show-error --output source.tar.gz "$source_url"
          source_sha256="$(sha256sum source.tar.gz | awk '{print $1}')"
          python3 scripts/generate_homebrew_formula.py \
            --version "$version" \
            --source-url "$source_url" \
            --source-sha256 "$source_sha256" \
            --homepage "$SERVER_URL/$REPOSITORY" \
            --output build/release/ck-utilities.rb
          ruby -c build/release/ck-utilities.rb

      - name: Attach Homebrew formula
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/ck-utilities.rb
